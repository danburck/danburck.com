# Netlify configuration for danburck.com

# Energy Mastery for Founders was renamed to Energy Led.
# force = true is required: the old directory still exists, and without it
# Netlify serves that file instead of applying the redirect.
[[redirects]]
  from = "/energymasteryforfounders"
  to = "/energyled"
  status = 301
  force = true

[[redirects]]
  from = "/energymasteryforfounders/"
  to = "/energyled"
  status = 301
  force = true

[[redirects]]
  from = "/energymasteryforfounders.html"
  to = "/energyled"
  status = 301
  force = true

# Clean URL redirects (remove .html extension)
[[redirects]]
  from = "/energyled.html"
  to = "/energyled"
  status = 301

[[redirects]]
  from = "/booking.html"
  to = "/booking"
  status = 301

# Build settings
[build]
  publish = "."
