# Netlify configuration for danburck.com

# Energy Mastery for Founders was renamed to Energy Led.
# force = true is required: the old directory still exists, and without it
# Netlify serves that file instead of applying the redirect.
[[redirects]]
  from = "/energymasteryforfounders"
  to = "/energyled"
  status = 301
  force = true

[[redirects]]
  from = "/energymasteryforfounders/"
  to = "/energyled"
  status = 301
  force = true

[[redirects]]
  from = "/energymasteryforfounders.html"
  to = "/energyled"
  status = 301
  force = true

# Clean URL redirects (remove .html extension)
[[redirects]]
  from = "/energyled.html"
  to = "/energyled"
  status = 301

[[redirects]]
  from = "/booking.html"
  to = "/booking"
  status = 301

# publish = "." means the repo root is the static root, so the function source
# and the manifests would otherwise be downloadable. The coaching frame and the
# mentor lenses live in netlify/lib and must not be.
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/"
  status = 404
  force = true

# Build settings
[build]
  publish = "."
  # The Evening Close functions sit behind /api/*, routed by each function's
  # own `config.path` export rather than by redirects.
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
